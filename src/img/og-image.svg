<!-- Quelle für das Social-Preview-Bild. Muss vor dem Launch einmal nach
     PNG gerastert werden (1200x630) und als og-image.png hier abgelegt. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="a" cx="25%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#7a3bb5" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7a3bb5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#d6a24a" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#d6a24a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#100818"/>
  <rect width="1200" height="630" fill="url(#a)"/>
  <rect width="1200" height="630" fill="url(#b)"/>
  <text x="90" y="180" font-family="Manrope, system-ui, sans-serif" font-size="22"
        letter-spacing="5" fill="#d6a24a">SHISHA LOUNGE · STUTTGART SÜD</text>
  <text x="86" y="330" font-family="Bodoni Moda, Georgia, serif" font-size="122"
        font-weight="500" fill="#ede4f5">Der Abend</text>
  <text x="86" y="450" font-family="Bodoni Moda, Georgia, serif" font-size="122"
        font-weight="400" font-style="italic" fill="#c08cf5">hat Zeit.</text>
  <text x="90" y="545" font-family="Manrope, system-ui, sans-serif" font-size="24"
        fill="#b6a6c6">Täglich ab 17 Uhr · Fr &amp; Sa bis 3 Uhr</text>
</svg>
